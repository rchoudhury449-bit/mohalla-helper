function csv(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const h=t[i];
 if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}
 else if(h=='"')q=true;else if(h==','){row.push(c);c=""}
 else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=""}else c+=h}

function table(t,a,b){const all=csv(t),i=all.findIndex(r=>{const l=r.map(x=>x.trim().toLowerCase());return l.includes(a)&&l.includes(b)});
 if(i<0)return[];const h=all[i].map(x=>x.trim());

async function get(u,key){try{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw 0;const t=await r.text();try{localStorage.setItem(key,t)}catch(e){}return t}
 catch(e){try{return localStorage.getItem(key)}catch(x){return null}}}


async function load(){
  if(!CONFIG.providersCsv){
    S.demo=false;
    S.p=[];
  } else {
    const t=await get(CONFIG.providersCsv,"mh_p");
    S.p=t
      ?table(t,"provider name","mobile number")
        .filter(p=>
          /^active$/i.test((p.Status||"").trim()) &&
          p["Provider Name"] &&
          dg(p["Mobile Number"]).length>=10
        )
        .map(p=>({
          ...p,
          Name:p["Provider Name"],
          Phone:p["Mobile Number"],
          Category:p["Service Catagory"],
          "Service details":p["Service Description"],
          "Area / Locality":p["Village/Locality"],
          Verified:"No"
        }))
      :[];
  }

  if(CONFIG.emergencyCsv){
    const t=await get(CONFIG.emergencyCsv,"mh_e");
    const e=t
      ?table(t,"service","number")
        .filter(x=>
          /^active$/i.test(x.Status||"") &&
          x.Service && x.Number
        )
      :[];
    if(e.length)S.e=e;
  }

  S.p.sort((a,b)=>
    (/^y/i.test(b.Verified)?1:0)-
    (/^y/i.test(a.Verified)?1:0)
  );

  S.v=true;
  render();
}

const tel = n => "tel:+" + CONFIG.cc + dg(n);
const wa = n => "https://wa.me/" + CONFIG.cc + dg(n);
const card = (p, i) => `<div class="card"><button class="row" data-go="#/p/${i}" style="border:0;background:none;padding:0;text-align:left;width:100%"><span class="ico">${ic(iconFor(p.Category))}</span><span style="flex:1"><b style="font-size:16px;display:block">${esc(p.Name)}</b><span class="mut">${esc(p["Service details"]||p.Category)}</span></span></button>
<div class="row" style="margin:12px 0 14px;gap:8px">${ver(p)?`<span class="tag">${ic("shield")}${T("verified")}</span>`:""}<span class="mut">${esc(p["Area / Locality"])}</span></div>
<div class="row" style="gap:10px"><a class="b call" href="${tel(p.Phone)}">${ic("phone")}Call</a><a class="b wa" href="${wa(p.Phone)}" target="_blank" rel="noopener">${ic("chat")}WhatsApp</a></div></div>`;
const head = (t, s) => `<div class="row"><button class="bk" data-go="#/" aria-label="${T("back")}">${ic("back")}</button><div style="flex:1"><h1 style="margin:0;font-size:22px">${esc(t)}</h1>${s?`<div class="mut">${esc(s)}</div>`:""}</div>${langButton()}</div>`;
const tabs = a => `<nav class="tabs"><div>${[["home",T("home"),"#/","h"],["alert",T("emergencyTab"),"#/e","e"],["plus",T("add"),"#/a","a"]].map(t=>`<button class="tab${t[3]==a?" on":""}" data-go="${t[2]}">${ic(t[0])}${t[1]}</button>`).join("")}</div></nav>`;
const demo = () => S.p.length ? "" : `<div class="demo">${T("demoOff")}</div>`;

const L = s => String(s || "").toLowerCase().trim();
const cntMap = () => { const m = {}; S.p.forEach(p => { const k = L(p.Category); m[k] = (m[k] || 0) + 1 }); return m };
const groups = () => { const known = new Set(CONFIG.groups.flatMap(g => g[1].map(L))), ex = [...new Set(S.p.map(p => p.Category).filter(c => c && !known.has(L(c))))]; return CONFIG.groups.concat(ex.length ? [["Other", ex]] : []) };
const tileHtml = (c, m) => `<button class="tile${m[L(c)] ? "" : " e"}" data-go="#/c/${encodeURIComponent(c)}"><span class="ico">${ic(iconFor(c))}</span>${esc(CL(c))}</button>`;
function vHome(){
 const m = cntMap();
 const sec = groups().map(g => { const l = g[1].filter(c => CONFIG.showEmpty || m[L(c)]); return l.length ? `<h2>${esc(CL(g[0]))}</h2><div class="grid">${l.map(c => tileHtml(c, m)).join("")}</div>` : "" }).join("");
 return `<div class="row mut" style="color:#0F5C4D;font-weight:600;gap:6px">${ic("pin")}${esc(T("areaLabel"))}<span style="margin-left:auto">${langButton()}</span><button id="inst" class="tag" hidden>Install app</button></div>
<h1>${esc(CONFIG.name)}</h1><div class="mut" style="font-size:14px">${T("tagline")}</div>${demo()}
<label class="sr">${ic("search")}<input id="q" placeholder="${T("search")}" aria-label="${T("search")}" autocomplete="off"></label>
<button class="sos" data-go="#/e">${ic("alert")}<span><b style="display:block">${T("emergency")}</b><span style="font-size:13px">${T("emergencySub")}</span></span></button>
<div id="res"></div><div id="gr">${sec || `<h2>${T("browse")}</h2><div class="card"><b>${T("noProviders")}</b><p class="mut">${T("noProvidersDesc")}</p><button class="b call" data-go="#/a">${T("add")}</button></div>`}
<div class="card" style="margin-top:18px"><b>${T("providerIntro")}</b><p class="mut">${T("providerNote")}</p><button class="b call" data-go="#/a" style="width:100%">${T("add")}</button></div><div class="card row" style="margin-top:12px;align-items:flex-start"><span style="color:#0F5C4D">${ic("shield")}</span><span class="mut" style="color:#3F4F49;line-height:1.45">${T("trusted")}</span></div></div>${tabs("h")}`}
function vCat(c){const l=S.p.map((p,i)=>[p,i]).filter(x=>L(x[0].Category)===L(c)&&(!S.vo||ver(x[0])));
 return head(CL(c),S.lang==='as'?T("areaLabel"):CONFIG.area)+`<div class="row" style="gap:8px;margin-top:16px"><button class="chip${S.vo?"":" on"}" data-vo="0">${T("all")}</button><button class="chip${S.vo?" on":""}" data-vo="1">${T("verifiedOnly")}</button></div>`+(l.map(x=>card(x[0],x[1])).join("")||`<div class="card"><p style="margin-top:0">No one has listed in this category yet. Know someone? Ask them to join.</p><button class="b call" data-go="#/a" style="width:100%">List your service</button></div>`)}
function vProv(i){const p=S.p[i];if(!p)return head("Not found")+tabs("h");
 const d=(n,l,v)=>v?`<div class="det"><span style="color:#0F5C4D">${ic(n)}</span><div><div class="mut" style="font-weight:600">${l}</div><div style="font-weight:600">${esc(v)}</div></div></div>`:"";
 return head("")+`<div style="text-align:center;margin-top:8px"><span class="ico" style="width:84px;height:84px;border-radius:28px;display:inline-flex">${ic(iconFor(p.Category))}</span><h1 style="margin:14px 0 8px;font-size:24px">${esc(p.Name)}</h1>${ver(p)?`<span class="tag">${ic("shield")}Verified by phone</span>`:`<span class="mut">Not verified yet</span>`}</div>
<div class="card" style="padding:4px 16px;margin-top:22px">${d("wrench","Service",p["Service details"]||p.Category)}${d("pin","Area",p["Area / Locality"])}${d("clock","Working hours",p["Working hours"])}${d("lang","Languages",p.Languages)}</div>
<p class="mut" style="text-align:center">Contact details are shown with the provider's consent.</p>
<div class="fix"><div><a class="b call" style="height:52px" href="${tel(p.Phone)}">${ic("phone")}Call now</a><a class="b wa" style="height:52px" href="${wa(p.Phone)}" target="_blank" rel="noopener">${ic("chat")}WhatsApp</a></div></div>`}
function vEmg(){return head("Emergency")+`<a class="b" style="margin-top:16px;height:60px;background:#B3261E;color:#fff;font-size:17px;border-radius:18px" href="tel:112">${ic("phone")}Call 112 now</a>`+
 S.e.map(x=>`<div class="card row" style="margin-top:10px;padding:12px 12px 12px 16px"><div style="flex:1"><div class="mut" style="font-weight:600;font-size:14px">${esc(x.Service)}</div><div class="num">${esc(x.Number)}</div></div><a class="b sosb" aria-label="Call ${esc(x.Service)}" href="tel:${esc(x.Number.replace(/[^\d+]/g,""))}">${ic("phone")}</a></div>`).join("")+tabs("e")}
function vAdd(){return head(T("add"),CONFIG.area)+`<div class="card"><p style="margin-top:0">${T("providerIntro")}</p><p class="mut">${T("providerNote")}</p>${CONFIG.formUrl?`<a class="b call" href="${esc(CONFIG.formUrl)}" target="_blank" rel="noopener">${T("add")}</a>`:`<form id="providerForm" class="provider-form"><label>${T("name")} *<input name="name" required maxlength="80" placeholder="e.g. Abdul Rahman"></label><label>${T("category")} *<select name="category" required><option value="">${T("category")}</option>${groups().flatMap(g=>g[1]).map(c=>`<option value="${esc(c)}">${esc(CL(c))}</option>`).join("")}</select></label><label>${T("phone")} *<input name="phone" required inputmode="tel" pattern="[0-9+() -]{10,18}" placeholder="10-digit mobile number"></label><label>${T("area")} *<input name="area" required maxlength="100" placeholder="Village / locality"></label><label>${T("details")}<textarea name="details" rows="2" maxlength="240"></textarea></label><label>${T("hours")}<input name="hours" maxlength="80" placeholder="e.g. 9 AM – 6 PM"></label><label>${T("languages")}<input name="languages" value="Assamese" maxlength="80"></label><label class="consent"><input type="checkbox" name="consent" required> ${T("consent")}</label><button class="b call" type="submit" style="width:100%">${T("prepare")}</button></form><div id="registrationResult" hidden></div>`}</div><p class="mut"><a href="privacy.html">${T("privacy")}</a></p>${tabs("a")}`}

function render(){const a=document.getElementById("app");if(!S.v){a.innerHTML=`<div class="mut" style="padding:40px 0;text-align:center">Loading...</div>`;return}
 const p=location.hash.slice(1).split("/"),k=p[1];
 a.innerHTML = k==="c"?vCat(decodeURIComponent(p[2]||"")):k==="p"?vProv(+p[2]):k==="e"?vEmg():k==="a"?vAdd():vHome();
 window.scrollTo(0,0);
 const q=document.getElementById("q");
 if(q)q.oninput=()=>{const s=L(q.value),r=document.getElementById("res"),g=document.getElementById("gr");g.hidden=!!s;
  const m=cntMap(),cs=groups().flatMap(x=>x[1]).filter(c=>L(c).includes(s)),ps=S.p.map((x,i)=>[x,i]).filter(x=>L(x[0].Name+" "+x[0].Category+" "+(x[0]["Service details"]||"")+" "+(x[0]["Area / Locality"]||"")).includes(s));
  r.innerHTML=s?(cs.length?`<h2>Categories</h2><div class="grid">${cs.map(c=>tileHtml(c,m)).join("")}</div>`:"")+(ps.length?`<h2>Providers</h2>`+ps.map(x=>card(x[0],x[1])).join(""):"")+(!cs.length&&!ps.length?`<div class="card mut">No match. Try another word.</div>`:""):""};
 if(window.dip){const b=document.getElementById("inst");if(b)b.hidden=false}}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){location.hash=g.dataset.go;return}
 const v=e.target.closest("[data-vo]");if(v){S.vo=v.dataset.vo==="1";render();return}
 if(e.target.closest("#langToggle")){S.lang=S.lang==="en"?"as":"en";try{localStorage.setItem("mh_lang",S.lang)}catch(e){};document.documentElement.lang=S.lang==="as"?"as":"en";render();return}
 if(e.target.closest("#inst")&&window.dip){window.dip.prompt()}});
document.addEventListener("submit",e=>{if(e.target.id!=="providerForm")return;e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f).entries());if(!d.consent){alert(T("needFields"));return}const lines=["Mohalla Helper — Provider Registration",`Name: ${d.name}`,`Category: ${d.category}`,`Phone: ${d.phone}`,`Village/locality: ${d.area}`,`Services: ${d.details||"Not provided"}`,`Working hours: ${d.hours||"Not provided"}`,`Languages: ${d.languages||"Not provided"}`,"Consent: Yes"];const box=document.getElementById("registrationResult");box.hidden=false;box.className="resultbox";box.innerHTML=`<b>${T("formLocal")}</b><p class="mut">${T("adminNote")}</p><pre id="registrationText" style="white-space:pre-wrap;font:13px/1.5 system-ui">${esc(lines.join("\n"))}</pre><button type="button" class="b wa" id="copyRegistration">${T("copy")}</button>`;document.getElementById("copyRegistration").onclick=async()=>{try{await navigator.clipboard.writeText(lines.join("\n"));document.getElementById("copyRegistration").textContent=T("copyDone")}catch(err){const range=document.createRange();range.selectNodeContents(document.getElementById("registrationText"));const sel=getSelection();sel.removeAllRanges();sel.addRange(range)}};});
addEventListener("hashchange",render);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.dip=e;const b=document.getElementById("inst");if(b)b.hidden=false});
try{navigator.serviceWorker.register("sw.js")}catch(e){}
document.documentElement.lang=S.lang==="as"?"as":"en";render();load();
</script>
</body>
</html>
